[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-poise"
version = "2.1.0"
description = "Real-source verification, portable pilot checkpoints and retained test diagnostics"
requires-python = ">=3.15,<3.16"
dependencies = [
    "psutil",
]

[project.scripts]
poise = "poise.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
