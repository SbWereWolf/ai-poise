[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-poise"
version = "2.1.0"
description = "Real-source verification, portable pilot checkpoints and retained test diagnostics"
requires-python = ">=3.15,<3.16"
dependencies = [
    "psutil",
    "yoyo-migrations==9.0.0",
]

[project.scripts]
poise = "poise.__main__:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = [
    "poise",
    "poise.*",
    "poise_environment",
    "poise_environment.*",
    "apps.bootstrap",
    "apps.bootstrap.*",
]

[tool.setuptools.package-data]
poise = [
    "infrastructure/requirements_sql/*.sql",
]
poise_environment = [
    "erp/runtime/application.php",
    "erp/runtime/environment.mjs",
]
