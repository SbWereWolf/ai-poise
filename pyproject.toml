[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-poise"
version = "0.16.1"
description = "Real-source verification, portable pilot checkpoints and retained test diagnostics"
requires-python = ">=3.13,<3.14"
dependencies = []

[project.scripts]
poise = "poise.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
